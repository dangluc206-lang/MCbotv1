name: package-extract-zip

on:
  push:
    branches:
      - fix/b5-b1-expand-compact-cycle

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create extract-only ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mcbot-package
          mkdir -p /tmp/mcbot-package
          rsync -a --exclude='.git' --exclude='node_modules' --exclude='data' --exclude='.env' ./ /tmp/mcbot-package/
          cd /tmp/mcbot-package
          zip -qr /tmp/MCbot_B5_B1_expand_compact_cycle_extract_only.zip .

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MCbot-B5-B1-expand-compact-cycle-extract-only
          path: /tmp/MCbot_B5_B1_expand_compact_cycle_extract_only.zip
          if-no-files-found: error
          retention-days: 7
