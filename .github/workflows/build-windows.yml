name: Build and Release Windows Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build and verify Windows installer
        run: node scripts/build-windows.js

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCbot-Windows-x64-${{ github.ref_name }}
          path: |
            out/make/squirrel.windows/x64/MCbot Setup.exe
            out/make/squirrel.windows/x64/*.nupkg
            out/make/squirrel.windows/x64/RELEASES
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $tag = "${{ github.ref_name }}"
          $assetDir = "out/make/squirrel.windows/x64"

          $assets = @(
            "$assetDir/MCbot Setup.exe",
            "$assetDir/RELEASES"
          )

          $packages = Get-ChildItem -Path $assetDir -Filter "*.nupkg" -File

          foreach ($package in $packages) {
            $assets += "$assetDir/$($package.Name)"
          }

          Write-Host "Release tag: $tag"
          Write-Host "Release assets:"

          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset)) {
              throw "Missing release asset: $asset"
            }

            Write-Host " - $asset"
          }

          gh release view $tag *> $null

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Creating GitHub Release $tag"

            gh release create $tag `
              --verify-tag `
              --generate-notes `
              --title "MCbot Desktop $tag"

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create GitHub Release $tag"
            }
          }
          else {
            Write-Host "GitHub Release $tag already exists"
          }

          foreach ($asset in $assets) {
            Write-Host "Uploading: $asset"

            gh release upload $tag $asset --clobber

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to upload release asset: $asset"
            }
          }

          Write-Host "GitHub Release assets uploaded successfully."