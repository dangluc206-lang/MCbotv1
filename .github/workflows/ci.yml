name: Refresh 2.7.67 baseline

on:
  push:
    branches: [ci-2.7.67-release-qualification]

permissions:
  contents: write

jobs:
  refresh-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ci-2.7.67-release-qualification
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore final CI workflow
        shell: bash
        run: |
          cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            push:
              branches: [main]
            pull_request:

          jobs:
            validate-and-test:
              runs-on: ubuntu-latest
              timeout-minutes: 15

              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Setup Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: '22'
                    cache: npm

                - name: Install dependencies
                  run: npm ci

                - name: Release quality gate
                  shell: bash
                  run: |
                    set -o pipefail
                    node scripts/run-quality-gates.js --lane release --json | tee /tmp/quality-gate-report.json

                - name: Upload quality gate report
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: quality-gate-report
                    path: /tmp/quality-gate-report.json
                    if-no-files-found: warn
          YAML

      - name: Capture packaged baseline and report
        shell: bash
        run: |
          set -euo pipefail
          SNAP="$RUNNER_TEMP/baseline-tree"
          rm -rf "$SNAP"
          mkdir -p "$SNAP"
          tar --exclude='./.git' --exclude='./node_modules' --exclude='./data' -cf - . | tar -xf - -C "$SNAP"
          (
            cd "$SNAP"
            node scripts/inspect-architecture-baseline.js > "$RUNNER_TEMP/current.json"
            cp "$RUNNER_TEMP/current.json" architecture/baseline/current.json
            node scripts/inspect-architecture-baseline.js --report > "$RUNNER_TEMP/WP-001_GAP_REPORT.md"
            node scripts/inspect-architecture-baseline.js --check
          )
          cp "$RUNNER_TEMP/current.json" architecture/baseline/current.json
          cp "$RUNNER_TEMP/WP-001_GAP_REPORT.md" docs/architecture-roadmap/baseline/WP-001_GAP_REPORT.md

      - name: Commit refreshed closure evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/ci.yml architecture/baseline/current.json docs/architecture-roadmap/baseline/WP-001_GAP_REPORT.md
          git diff --cached --check
          git commit -m "ci: refresh 2.7.67 closure baseline"
          git push origin HEAD:ci-2.7.67-release-qualification
