name: CI dependency qualification

on:
  pull_request:

jobs:
  validate-and-export-runtime-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release quality gate
        shell: bash
        run: |
          set -o pipefail
          node scripts/run-quality-gates.js --lane release --json | tee /tmp/quality-gate-report.json

      - name: Materialize production dependency graph
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          DEPS="$RUNNER_TEMP/runtime-deps"
          mkdir -p "$DEPS"
          cp package.json package-lock.json "$DEPS/"
          cd "$DEPS"
          npm ci --omit=dev --ignore-scripts
          tar -czf "$RUNNER_TEMP/runtime-node-modules.tar.gz" node_modules

      - name: Upload production dependencies
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-node-modules
          path: ${{ runner.temp }}/runtime-node-modules.tar.gz
          if-no-files-found: error
          compression-level: 0

      - name: Upload quality gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-report
          path: /tmp/quality-gate-report.json
          if-no-files-found: warn
